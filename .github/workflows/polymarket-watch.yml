name: Polymarket Watch 24/7

on:
  schedule:
    # Cada 30 minutos — ajustá la frecuencia si querés
    - cron: '*/30 * * * *'
  workflow_dispatch:  # Podés correrlo manual desde GitHub Actions tab
  push:
    branches: [main]
permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Run Polymarket scan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || '8934957659' }}
          TRENDING_LIMIT: '5'
        run: python polymarket_watch.py
